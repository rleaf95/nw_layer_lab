version: '3.8'

services:
  client-node:
    build: .
    container_name: client_node
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./:/app
    networks:
      - lab-net
    command: >
      bash -c "
        iptables -A OUTPUT -p tcp --tcp-flags RST RST -j DROP &&
        echo 'RST drop rule applied successfully!' &&
        tail -f /dev/null
      "

  server-node:
    build: .
    container_name: server_node
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./:/app
    networks:
      - lab-net

  sniffer-node:
    build: .
    container_name: sniffer_node
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - lab-net
    sysctls:
      - net.ipv4.ip_forward=0
    command: >
      bash -c "
        iptables -A OUTPUT -p tcp --tcp-flags RST RST -j DROP &&
        echo 'RST drop rule applied successfully!' &&
        tail -f /dev/null
      "

   

networks:
  lab-net:
    driver: bridge